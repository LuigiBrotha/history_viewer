<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>U-boat Route Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <aside id="sidebar">
      <h2>
        <button id="toggle-boats" type="button" aria-expanded="true" aria-controls="sidebar-body">
          <span id="boats-heading">Actieve boten</span>
          <span id="toggle-boats-icon" aria-hidden="true"></span>
        </button>
      </h2>
      <div id="sidebar-body">
        <div id="live-status"></div>
        <a id="all-routes-link" href="status">Alle routes</a>
        <div id="boat-date-label"></div>
        <div id="follow-status"></div>
        <ul id="boat-list"></ul>
        <button id="reset-follow" hidden>Terug naar volledige weergave</button>
      </div>
    </aside>

    <div id="timeline">
      <button id="play-pause">▶</button>
      <input type="range" id="date-slider" min="0" max="0" value="0" step="1" />
      <span id="date-display"></span>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
