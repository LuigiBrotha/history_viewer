<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>U-boat Alle routes</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="status-page">
  <header id="status-header">
    <div id="status-summary">
      <nav id="page-links">
        <a href="./" data-carry="date">Tijdlijn</a>
        <a href="heatmap" data-carry="period">Heatmap</a>
        <a href="grafiek">Grafiek</a>
      </nav>
      <div id="live-status"></div>
    </div>
    <div id="period">
      <div id="period-summary">
        <span id="period-label"></span>
        <button type="button" id="period-reset">Alles</button>
      </div>
      <div id="slider-track">
        <div class="slider-window" id="slider-window"></div>
        <div class="slider-handle" id="slider-from" role="slider" tabindex="0"></div>
        <div class="slider-handle" id="slider-to" role="slider" tabindex="0"></div>
      </div>
      <div id="slider-ticks"></div>
      <div id="legend">
        <span id="route-count"></span>
        <span id="legend-last"><span id="legend-last-swatch"></span>laatst opgehaald</span>
      </div>
    </div>
  </header>
  <div id="article-split" class="pane-hidden">
    <div id="battle-split" class="pane-hidden">
      <div id="map-side">
        <div id="status-map"></div>
        <aside id="boat-panel" tabindex="-1" aria-label="Gegevens van de boot" hidden></aside>
        <button id="battle-toggle" type="button" aria-controls="battle-pane" aria-expanded="false">Veldslagen</button>
      </div>
      <div id="battle-divider" role="separator" aria-orientation="vertical" aria-label="Formaat van de lijst met veldslagen" aria-controls="battle-pane" tabindex="0"></div>
      <aside id="battle-pane" aria-label="Veldslagen"></aside>
    </div>
    <div id="article-divider" role="separator" aria-orientation="vertical" aria-label="Formaat van het artikel" aria-controls="article-pane" tabindex="0"></div>
    <article id="article-pane" aria-label="Artikel"></article>
  </div>

  <div id="load-indicator"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/status.js"></script>
</body>
</html>
