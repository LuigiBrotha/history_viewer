[tool.poetry]
name = "uboats"
version = "0.1.0"
description = ""
authors = ["LuigiBrotha <d_verhoef@hotmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
wireup = "^2.12.0"
fastapi = "^0.139.2"
pydantic-settings = "^2.14.2"
uvicorn = "^0.51.0"
requests = "^2.34.2"
selectolax = "^0.4.11"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.51"}
aiosqlite = "^0.22.1"
shapely = "^2.2.0"
numpy = "^2.5.4"
scipy = "^1.18.1"
mwparserfromhell = "^0.6.6"
nh3 = "^0.2.21"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^1.4.0"
pillow = "^13.0.0"


[tool.poetry.group.translate.dependencies]
ctranslate2 = "^4.8.5"
sentencepiece = "^0.2.3"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
